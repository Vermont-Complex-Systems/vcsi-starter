<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" width="640" height="432"
     role="img" aria-labelledby="pl-title pl-desc"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="currentColor">
  <title id="pl-title">Page layout structure</title>
  <desc id="pl-desc">A body flex-column stacks a Nav bar, a flex:1 main region holding the centered
    .page (5% side padding, max-width 1200px, 5.5rem top padding, 7.5rem bottom margin), and a Footer bar.
    Nav, Footer, and .page share the same inline-padding and max-width tokens, so their content edges align.</desc>

  <text x="16" y="22" fill-opacity="0.55">body · flex-direction: column · min-height: 100dvh</text>
  <rect x="14" y="32" width="612" height="372" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.32" stroke-dasharray="5 4"/>

  <line x1="66" y1="46" x2="66" y2="390" stroke="currentColor" stroke-opacity="0.22" stroke-dasharray="3 4"/>
  <line x1="574" y1="46" x2="574" y2="390" stroke="currentColor" stroke-opacity="0.22" stroke-dasharray="3 4"/>

  <!-- Nav -->
  <rect x="26" y="46" width="588" height="44" rx="4" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.28"/>
  <rect x="26" y="46" width="40" height="44" fill-opacity="0.09"/>
  <rect x="574" y="46" width="40" height="44" fill-opacity="0.09"/>
  <text x="46" y="71" text-anchor="middle" font-size="9" fill-opacity="0.5">5%</text>
  <text x="594" y="71" text-anchor="middle" font-size="9" fill-opacity="0.5">5%</text>
  <text x="320" y="72" text-anchor="middle" font-size="12" font-weight="600">&lt;Nav /&gt;</text>

  <!-- main (flex: 1) -->
  <rect x="26" y="100" width="588" height="250" rx="6" fill="none" stroke="#e0843c" stroke-width="2"/>
  <text x="34" y="116" fill="#e0843c" font-size="11" font-weight="600">main · flex: 1</text>

  <!-- .page inside main -->
  <rect x="26" y="128" width="40" height="204" fill-opacity="0.09"/>
  <rect x="574" y="128" width="40" height="204" fill-opacity="0.09"/>
  <text x="46" y="232" text-anchor="middle" font-size="9" fill-opacity="0.5">5%</text>
  <text x="594" y="232" text-anchor="middle" font-size="9" fill-opacity="0.5">5%</text>

  <rect x="66" y="128" width="508" height="204" rx="4" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.28"/>
  <text x="74" y="145" fill-opacity="0.55">.page</text>
  <text x="566" y="145" text-anchor="end" fill-opacity="0.55">max-width: 1200px</text>

  <rect x="78" y="156" width="484" height="20" fill-opacity="0.09"/>
  <text x="320" y="170" text-anchor="middle" font-size="9" fill-opacity="0.5">padding-top: 5.5rem</text>

  <rect x="78" y="184" width="484" height="90" rx="4" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.28"/>
  <text x="320" y="233" text-anchor="middle" fill-opacity="0.55">Centered content…</text>

  <rect x="78" y="282" width="484" height="30" fill-opacity="0.09"/>
  <text x="320" y="301" text-anchor="middle" font-size="9" fill-opacity="0.5">margin-bottom: 7.5rem</text>

  <!-- Footer -->
  <rect x="26" y="360" width="588" height="40" rx="4" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.28"/>
  <rect x="26" y="360" width="40" height="40" fill-opacity="0.09"/>
  <rect x="574" y="360" width="40" height="40" fill-opacity="0.09"/>
  <text x="46" y="383" text-anchor="middle" font-size="9" fill-opacity="0.5">5%</text>
  <text x="594" y="383" text-anchor="middle" font-size="9" fill-opacity="0.5">5%</text>
  <text x="320" y="384" text-anchor="middle" font-size="12" font-weight="600">&lt;Footer /&gt;</text>

  <text x="320" y="424" text-anchor="middle" fill-opacity="0.55">Nav, Footer &amp; .page share --vcsi-page-inline-padding (5%) and --vcsi-page-max-width</text>
</svg>
