<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410"
     role="img" aria-labelledby="sl-title sl-desc"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="currentColor">
  <title id="sl-title">Split layout structure</title>
  <desc id="sl-desc">Inside a .story container, a full-width split-layout section keeps 2rem side padding and
    lays out two columns: a scrolly-content column (1fr) holding stacked steps with a top and bottom spacer,
    a 2rem gap, and a sticky-panel column (minmax(450px, 45%)) holding the visualization that stays pinned
    while the steps scroll. Add the reversed modifier to swap the columns.</desc>

  <text x="16" y="20" fill-opacity="0.55">.story</text>
  <rect x="14" y="28" width="612" height="360" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.32" stroke-dasharray="5 4"/>

  <rect x="190" y="40" width="260" height="28" rx="4" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.28"/>
  <text x="320" y="58" text-anchor="middle" fill-opacity="0.55">centered prose · max-width 600px</text>

  <text x="196" y="88" text-anchor="middle" fill-opacity="0.55">scrolly-content · 1fr</text>
  <text x="469" y="88" text-anchor="middle" fill-opacity="0.55">sticky-panel · minmax(450px, 45%)</text>

  <rect x="26" y="96" width="30" height="236" fill-opacity="0.09"/>
  <rect x="584" y="96" width="30" height="236" fill-opacity="0.09"/>
  <text x="41" y="214" text-anchor="middle" font-size="9" fill-opacity="0.5" transform="rotate(-90 41 214)">2rem</text>
  <text x="599" y="214" text-anchor="middle" font-size="9" fill-opacity="0.5" transform="rotate(-90 599 214)">2rem</text>

  <rect x="62" y="96" width="268" height="236" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.3" stroke-dasharray="5 4"/>
  <text x="70" y="112" fill-opacity="0.55">scrolly-content</text>
  <rect x="74" y="120" width="244" height="18" rx="3" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.28"/>
  <text x="196" y="132" text-anchor="middle" font-size="9" fill-opacity="0.5">spacer</text>
  <rect x="74" y="146" width="244" height="30" rx="4" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.28"/>
  <text x="196" y="165" text-anchor="middle" fill-opacity="0.55">Step 1</text>
  <rect x="74" y="182" width="244" height="30" rx="4" fill-opacity="0.02" stroke="#e0843c" stroke-width="2"/>
  <text x="196" y="201" text-anchor="middle" fill="#e0843c" font-size="10" font-weight="600">Step 2 · active</text>
  <rect x="74" y="218" width="244" height="30" rx="4" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.28"/>
  <text x="196" y="237" text-anchor="middle" fill-opacity="0.55">Step 3</text>
  <rect x="74" y="254" width="244" height="18" rx="3" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.28"/>
  <text x="196" y="266" text-anchor="middle" font-size="9" fill-opacity="0.5">spacer</text>

  <line x1="342" y1="118" x2="342" y2="310" stroke="currentColor" stroke-opacity="0.3" stroke-dasharray="5 4"/>
  <text x="342" y="216" text-anchor="middle" font-size="9" fill-opacity="0.5" transform="rotate(-90 342 216)">2rem gap</text>

  <rect x="354" y="96" width="230" height="236" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.3" stroke-dasharray="5 4"/>
  <text x="362" y="112" fill-opacity="0.55">sticky-panel</text>
  <text x="576" y="112" text-anchor="end" fill="#e0843c" font-size="10" font-weight="600">position: sticky</text>
  <rect x="362" y="122" width="214" height="200" rx="4" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.28"/>
  <text x="469" y="216" text-anchor="middle" font-size="11" font-weight="600">Visualization</text>
  <text x="469" y="234" text-anchor="middle" font-size="9" fill-opacity="0.5">stays pinned while steps scroll</text>

  <rect x="190" y="348" width="260" height="26" rx="4" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.28"/>
  <text x="320" y="365" text-anchor="middle" fill-opacity="0.55">…more prose…</text>

  <text x="320" y="402" text-anchor="middle" fill-opacity="0.55">scrolly-content scrolls past the pinned sticky-panel · add .reversed to swap sides</text>
</svg>
