<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340"
     role="img" aria-labelledby="fs-title fs-desc"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="currentColor">
  <title id="fs-title">Fullscreen layout structure</title>
  <desc id="fs-desc">A fullscreen-layout spans 100vw edge-to-edge. The sticky-panel fills the whole viewport
    (100vh) with the visualization, and constrained step boxes (max-width 500px) are overlaid on top, centered
    near the bottom. It escapes the prose container with margin-left: calc(-50vw + 50%).</desc>

  <text x="320" y="24" text-anchor="middle" fill-opacity="0.55">&#9664;&#8195;100vw · edge-to-edge&#8195;&#9654;</text>

  <rect x="14" y="44" width="612" height="224" rx="4" fill="none" stroke="#e0843c" stroke-width="2"/>

  <rect x="22" y="52" width="596" height="208" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.3" stroke-dasharray="5 4"/>
  <text x="30" y="68" fill-opacity="0.55">sticky-panel · 100vh</text>
  <rect x="30" y="76" width="580" height="176" rx="4" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.28"/>
  <text x="320" y="164" text-anchor="middle" font-size="11" font-weight="600">Full-screen visualization</text>

  <rect x="264" y="196" width="112" height="16" rx="8" fill="#e0843c"/>
  <text x="320" y="207" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">max-width: 500px</text>
  <rect x="244" y="216" width="152" height="40" rx="4" fill-opacity="0.02" stroke="#e0843c" stroke-width="2"/>
  <text x="320" y="240" text-anchor="middle">Step (overlaid)</text>

  <text x="320" y="300" text-anchor="middle" fill-opacity="0.55">margin-left: calc(-50vw + 50%) breaks out of the container</text>
</svg>
