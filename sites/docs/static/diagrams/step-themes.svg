<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img"
     aria-labelledby="st-title st-desc" width="640" height="250">
  <title id="st-title">Step theme states</title>
  <desc id="st-desc">Step boxes shown in the light theme and the dark theme, each with an active state
    (bright background, dark shadow) and an inactive state (dimmed background and text). Active uses
    --vcsi-story-step-bg / -fg; inactive uses --vcsi-story-step-bg-inactive / -fg-inactive.</desc>

  <style>
    :root{--ink:#4a4a4a;--muted:#8a8a8a;}
    @media (prefers-color-scheme: dark){:root{--ink:#d2d2d2;--muted:#8c8c8c;}}
    text{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .t-step{font-size:13px;font-weight:500}
    .t-panel{font-size:11px;font-weight:700}
    .t-small{font-size:10px;fill:var(--muted)}
    .t-tag{font-size:9px;font-weight:600}
  </style>

  <defs>
    <filter id="stsh" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Light theme panel (fixed light colors) -->
  <rect x="18" y="34" width="292" height="182" rx="8" fill="#f4f2ee"/>
  <text class="t-panel" x="36" y="58" style="fill:#555555">Light theme</text>
  <rect x="40" y="76" width="248" height="48" rx="6" fill="#ffffff" filter="url(#stsh)"/>
  <text class="t-step" x="164" y="105" text-anchor="middle" style="fill:#333333">Active step</text>
  <text class="mono t-tag" x="278" y="70" text-anchor="end" style="fill:#9a9a9a">active</text>
  <rect x="40" y="150" width="248" height="48" rx="6" fill="#f5f5f5"/>
  <text class="t-step" x="164" y="179" text-anchor="middle" style="fill:#6d6d6d">Inactive step</text>
  <text class="mono t-tag" x="278" y="144" text-anchor="end" style="fill:#c4c4c4">inactive</text>

  <!-- Dark theme panel (fixed dark colors) -->
  <rect x="330" y="34" width="292" height="182" rx="8" fill="#1a1a1a"/>
  <text class="t-panel" x="348" y="58" style="fill:#999999">Dark theme</text>
  <rect x="352" y="76" width="248" height="48" rx="6" fill="#43484c" filter="url(#stsh)"/>
  <text class="t-step" x="476" y="105" text-anchor="middle" style="fill:#f2f2f2">Active step</text>
  <text class="mono t-tag" x="590" y="70" text-anchor="end" style="fill:#777777">active</text>
  <rect x="352" y="150" width="248" height="48" rx="6" fill="#24262a"/>
  <text class="t-step" x="476" y="179" text-anchor="middle" style="fill:#9aa0a4">Inactive step</text>
  <text class="mono t-tag" x="590" y="144" text-anchor="end" style="fill:#5a5a5a">inactive</text>

  <!-- caption -->
  <text class="mono t-small" x="320" y="238" text-anchor="middle">active: --vcsi-story-step-bg / -fg&#8195;·&#8195;inactive: --vcsi-story-step-bg-inactive / -fg-inactive</text>
</svg>
